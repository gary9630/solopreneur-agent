[project]
name = "deal-agent"
version = "0.1.0"
description = "Deal-to-delivery agent app for the NVIDIA NemoClaw hackathon MVP."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deal_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
